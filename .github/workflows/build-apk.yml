name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create missing environment files
      run: |
        touch .env
        touch .env.example

    - name: Fix AI Studio Plugin Version
      run: |
        find . -type f \( -name "*.kts" -o -name "*.gradle" \) -exec sed -i "s/9.1.1/8.5.0/g" {} +
        find . -type f \( -name "*.kts" -o -name "*.gradle" \) -exec sed -i "s/version \"9\.[^\"]*\"/version \"8.5.0\"/g" {} +

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
